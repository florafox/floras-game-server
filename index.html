<!DOCTYPE html>
<html>

    <title>Floras Game Server</title>

    <style type="text/css">
        body {
            margin: 0;
            padding: 30px 10px;
            background: #d7dce2;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #222;
        }

        .page {
            width: 700px;
            max-width: 90%;
            margin: 0 auto;
            background: #f4f5f7;
            border: 1px solid #888;
            box-shadow: 0 2px 8px #999;
        }

        .header {
            padding: 18px 25px;
            color: white;
            border-bottom: 1px solid #31557a;

            background: #4d82b5;
            background-image: linear-gradient(
                #75a7d2,
                #4d82b5 50%,
                #3e6e9d 51%,
                #4d82b5
            );
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 5px 0 0 0;
            color: #e6f1fb;
        }

        .content {
            padding: 25px;
            background: white;
        }

        .content h2 {
            margin-top: 0;
            color: #315d86;
        }

        .files {
            margin: 20px 0;
            padding: 0;
            list-style: none;
        }

        .files li {
            margin-bottom: 6px;
        }

        .files a {
            display: block;
            padding: 9px 12px;
            color: #174b7a;
            text-decoration: none;
            border: 1px solid #b5c2cf;

            background: #e8eef4;
            background-image: linear-gradient(
                #ffffff,
                #e8eef4
            );
        }

        .files a:hover {
            color: #0b3559;
            border-color: #7897b3;
            background: #dce8f3;
        }

        .footer {
            padding: 10px 25px;
            border-top: 1px solid #ccc;
            background: #e2e5e9;
            color: #666;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="page">
